<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickMart IOMS - Inventory and Order Management System Login">
    <title>QuickMart IOMS - Login</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../icons/icon-512.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Login Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Animated Particles -->
    <div class="particles-bg"></div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-wrapper">
            <!-- Login Card with Neumorphism Effect -->
            <div class="card login-card p-4 p-md-5">
                <div class="card-body">
                    <!-- Brand Header -->
                    <div class="brand-header text-center mb-4">
                        <div class="brand-icon mb-3">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <h1 class="brand-title">
                            <span class="text-gradient">QUICK</span><span class="text-white">MART</span>
                        </h1>
                        <p class="brand-subtitle text-muted">Inventory & Order Management System</p>
                    </div>

                    <h5 class="text-center text-secondary mb-4">
                        <i class="fas fa-shield-alt me-2"></i>Staff Login Portal
                    </h5>

                    <form id="loginForm" novalidate>
                        <!-- Email / Staff ID Field -->
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control" id="emailInput"
                                placeholder="name@example.com or STF001" autocomplete="username" required>
                            <label for="emailInput">
                                <i class="fas fa-user me-2 text-primary"></i>Email / Staff ID
                            </label>
                            <div class="invalid-feedback">
                                Please enter your email or staff ID.
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="form-floating mb-4 position-relative">
                            <input type="password" class="form-control" id="passwordInput" placeholder="Password"
                                autocomplete="current-password" required>
                            <label for="passwordInput">
                                <i class="fas fa-lock me-2 text-primary"></i>Password
                            </label>
                            <button type="button" class="password-toggle" id="togglePassword"
                                aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                            <div class="invalid-feedback">
                                Please enter your password.
                            </div>
                        </div>

                        <!-- Remember Me Checkbox -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">
                                Remember me on this device
                            </label>
                        </div>

                        <!-- Action Buttons -->
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold btn-login">
                                    <i class="fas fa-sign-in-alt me-2"></i>LOGIN
                                </button>
                            </div>
                            <div class="col-12 col-md-6">
                                <button type="reset" class="btn btn-outline-secondary w-100 py-3 fw-bold btn-reset">
                                    <i class="fas fa-undo me-2"></i>RESET
                                </button>
                            </div>
                        </div>

                        <!-- Footer Links -->
                        <div class="text-center footer-links">
                            <a href="#" class="d-block mb-2 text-decoration-none link-forgot" id="forgotPasswordLink">
                                <i class="fas fa-key me-1"></i> Forgot Password?
                                <strong class="text-primary">Click Here</strong>
                            </a>
                            <p class="text-muted small mt-3 mb-0">
                                <i class="fas fa-info-circle me-1"></i>
                                Staff accounts are managed by system administrators
                            </p>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Footer Copyright -->
            <p class="text-center text-muted mt-4 copyright">
                <small>&copy; 2024 QuickMart IOMS. All rights reserved.</small>
            </p>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="background: linear-gradient(145deg, #1a1a2e, #16213e); border: 1px solid rgba(255,255,255,0.1);">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="forgotPasswordModalLabel">
                        <i class="fas fa-key me-2 text-primary"></i>Reset Password
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="forgotPasswordForm">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="resetEmail" placeholder="Enter your email"
                                required>
                            <label for="resetEmail"><i class="fas fa-envelope me-2"></i>Email Address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="newPassword" placeholder="New Password"
                                minlength="6" required>
                            <label for="newPassword"><i class="fas fa-lock me-2"></i>New Password</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="confirmNewPassword"
                                placeholder="Confirm Password" required>
                            <label for="confirmNewPassword"><i class="fas fa-lock me-2"></i>Confirm Password</label>
                        </div>
                        <div id="resetMessage" class="alert d-none"></div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="resetBtn">
                            <i class="fas fa-sync-alt me-2"></i>Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login Logic Script -->
    <script src="login.js"></script>
</body>

</html>
